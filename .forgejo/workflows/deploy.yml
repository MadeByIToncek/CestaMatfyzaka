name: Publish
on:
  push:
    branches: [pages]
jobs:
  publish:
    runs-on: codeberg-tiny
    steps:
      - uses: actions/checkout@v7
      - run: |
          # Use your favorite static site generator here!
          mkdir _site
          ls -lah ./
      - uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://${{ forge.repository_owner }}.codeberg.page/repository-name/
          token: ${{ forge.token }}
          source: _site/
          pretty-urls: true
